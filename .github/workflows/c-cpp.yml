name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: [self-hosted, Linux, X64]

    steps:
    - uses: actions/checkout@v3
    - name: Check OCI source labels
      shell: bash
      run: |
        # GHCR links a package to its repo via org.opencontainers.image.source;
        # every Containerfile/Dockerfile (incl. templates) must carry it.
        want="org.opencontainers.image.source=\"https://github.com/${GITHUB_REPOSITORY}\""
        status=0
        while IFS= read -r f; do
          grep -qF "$want" "$f" || { echo "::error file=$f::missing $want"; status=1; }
        done < <(git ls-files | grep -iE '(^|/)(containerfile|dockerfile)[^/]*$|\.(containerfile|dockerfile)(\.j2)?$' | grep -viE '\.(md|py|sh|txt|ya?ml|json)$')
        exit "$status"
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake pkg-config git \
          libusb-1.0-0-dev libserialport-dev libopencv-dev \
          libopenmpi-dev libpcap-dev libgl1-mesa-dev freeglut3-dev \
          libvtk9-dev python3-dev python3-numpy
    - name: Build libcaer dependency
      run: |
        git clone --depth 1 https://gitlab.com/inivation/dv/libcaer.git "$RUNNER_TEMP/libcaer"
        cmake -S "$RUNNER_TEMP/libcaer" -B "$RUNNER_TEMP/libcaer/build" \
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
        cmake --build "$RUNNER_TEMP/libcaer/build" --parallel 2
        sudo cmake --install "$RUNNER_TEMP/libcaer/build"
        sudo ldconfig
    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
    - name: Build
      run: cmake --build build --parallel 2
